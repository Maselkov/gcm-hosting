name: Publish image

# Pushes the image to ghcr.io/<owner>/<repo>: main -> latest and main;
# v1.2.3 -> 1.2.3 and 1.2; every push -> sha-<short>. No Actions cache
# anywhere here (cache poisoning): the tests install without pip's, and
# the build caches in the registry instead. Then deploys it (deploy.yml):
# a tag to production, main or a branch run by hand to testing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # So a commit that fails them never ships.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Spelled out: image refs must be lowercase, github.repository
          # isn't.
          cache-from: type=registry,ref=ghcr.io/maselkov/gcm-hosting:buildcache
          cache-to: type=registry,ref=ghcr.io/maselkov/gcm-hosting:buildcache,mode=max

  deploy:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref_type == 'tag' && 'production' || 'testing' }}
    # Without it a called workflow's environment secrets come out empty,
    # its environment notwithstanding.
    secrets: inherit
