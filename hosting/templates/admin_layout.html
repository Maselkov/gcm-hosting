<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
  <title>{% block title %}Control panel{% endblock %} · GTNH Craft Monitor hosting</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin">
<main class="wide">
  <nav class="crumbs">
    <a href="{{ url_for('admin.overview') }}">Control panel</a>
    {% block crumbs %}{% endblock %}
    <span class="spacer"></span>
    <a href="{{ url_for('pages.index') }}">Site</a>
    <span class="who">{{ account.name }}</span>
  </nav>
  {% for message in get_flashed_messages() %}<p class="notice">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
